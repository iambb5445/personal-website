version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rbenv install 3.2.2 -s
        - rbenv global 3.2.2
        - ruby -v
        - rm -f Gemfile.lock
        - gem install bundler
        - bundle install
    build:
      commands:
        - bundle exec jekyll build -d public
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - vendor/bundle/**/*
